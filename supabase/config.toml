project_id = "jupa-sep-playwright"

# Settings for the disposable local Supabase instance used by Playwright.
# No hosted project is linked or modified by supabase start.
[auth]
enabled = true
enable_signup = true
site_url = "http://jupa-sep.test:3000"
additional_redirect_urls = [
  "http://jupa-sep.test:3000",
  "http://127.0.0.1:3000",
  "http://localhost:3000"
]

[auth.email]
enabled = true
enable_confirmations = false

[db]
# Use non-default ports to avoid collisions with other local services on CI runners.
port = 55432
shadow_port = 55430

[db.seed]
enabled = false
