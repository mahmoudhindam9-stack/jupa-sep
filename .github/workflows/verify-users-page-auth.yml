name: Verify managed users and permissions

on:
  push:
    branches:
      - main
      - fix/users-page-auth-permissions-2026-10-10
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript diagnostics (the repository has existing unrelated errors)
        continue-on-error: true
        run: npm run typecheck
      - name: Production build
        run: npm run build
