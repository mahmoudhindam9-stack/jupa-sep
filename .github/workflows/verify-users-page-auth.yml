name: Verify managed users and Developer Studio integrity

on:
  push:
    branches:
      - main
      - fix/users-page-auth-permissions-2026-10-10
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Managed-user and Studio integrity tests
        run: npm test -- --run src/features/auth/services/managedUserValidation.test.ts src/features/developer-studio/__tests__/studioIntegrity.test.ts
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
