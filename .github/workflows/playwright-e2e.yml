name: Playwright - isolated Supabase staging

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "supabase/**"
      - "vite.config.ts"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.ts"
      - "e2e/**"
      - ".github/workflows/playwright-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-staging-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Browser regression tests (disposable database)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLAYWRIGHT_BASE_URL: http://jupa-sep.test:3000
      VITE_E2E_ISOLATED: "true"

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Map the local test hostname
        run: echo "127.0.0.1 jupa-sep.test" | sudo tee -a /etc/hosts

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3

      - name: Install application dependencies
        run: npm ci --no-audit --no-fund

      - name: Start disposable local Supabase services
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor

      - name: Apply all repository migrations to the disposable local database
        run: supabase db reset --local --no-seed

      - name: Export only the local Supabase URL and public key
        shell: bash
        run: |
          set -euo pipefail
          supabase status -o env > "$RUNNER_TEMP/jupa-supabase.env"
          set -a
          source "$RUNNER_TEMP/jupa-supabase.env"
          set +a
          test "$API_URL" = "http://127.0.0.1:54321"
          {
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY"
          } >> "$GITHUB_ENV"

      - name: Install pinned Playwright Test runner
        run: npm install --no-save --no-audit --no-fund @playwright/test@1.65.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright against the isolated local stack
        run: npm run test:e2e

      - name: Upload Playwright report and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: juba-sep-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop the disposable Supabase stack
        if: always()
        run: supabase stop --no-backup
