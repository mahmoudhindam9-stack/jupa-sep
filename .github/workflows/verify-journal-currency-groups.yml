name: Verify Journal Currency Groups

on:
  push:
    branches:
      - audit-import-guards-2026-08-29

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - run: npm run build
