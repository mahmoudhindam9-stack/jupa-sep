name: Verify Developer Studio Build

on:
  push:
    branches:
      - main
    paths:
      - "src/features/developer-studio/**"
      - "src/routes/admin/studio.tsx"
      - "src/routes/__root.tsx"
      - "src/routes/admin/developer-studio.tsx"
      - "src/routes/admin/system-update.tsx"
      - "src/components/CurrencySwitcher.tsx"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - ".github/workflows/verify-studio-build.yml"
  pull_request:
    paths:
      - "src/features/developer-studio/**"
      - "src/routes/admin/studio.tsx"
      - "src/routes/__root.tsx"
      - "src/routes/admin/developer-studio.tsx"
      - "src/routes/admin/system-update.tsx"
      - "src/components/CurrencySwitcher.tsx"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - ".github/workflows/verify-studio-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-studio-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Production build
        run: npm run build
